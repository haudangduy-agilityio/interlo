<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>m0b06 test page</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B3D91; color: #fff; font: 34px sans-serif; overflow: hidden; cursor: default; }
  #t { position: absolute; top: 70px; left: 0; right: 0; text-align: center; padding: 0 60px; line-height: 1.35; }
  #m { position: absolute; border: 4px solid #ffd400; background: rgba(255, 212, 0, 0.25); box-sizing: border-box; display: none; }
  #s { position: absolute; top: 10px; left: 14px; font-size: 15px; opacity: 0.7; }
</style>
</head>
<body>
<div id="s">m0b06 test page</div>
<p id="t">Waiting for the harness.</p>
<div id="m"></div>
<script>
// Test window of the panel spike (SPEC O-8). It tells the harness about its size, every key and every
// click through requests to its own loopback server; the harness tells it what to ask the owner.
const log = (q) => fetch('/log?' + q, { cache: 'no-store' }).catch(() => {});
function size() {
  const full = Math.abs(innerWidth - screen.width) <= 2 && Math.abs(innerHeight - screen.height) <= 2;
  log('ev=FULLSCREEN&v=' + (full ? 'yes' : 'no') + '&iw=' + innerWidth + '&ih=' + innerHeight + '&sw=' + screen.width + '&sh=' + screen.height);
}
addEventListener('resize', size);
setInterval(size, 5000);
size();
addEventListener('keydown', (e) => log('ev=KEY&key=' + encodeURIComponent(e.code)));
addEventListener('mousedown', (e) => log('ev=CLICK&x=' + Math.round(e.clientX) + '&y=' + Math.round(e.clientY)));
let seq = null;
async function poll() {
  try {
    const st = await (await fetch('/state', { cache: 'no-store' })).json();
    if (st.seq !== seq) {
      seq = st.seq;
      document.getElementById('t').textContent = st.text || '';
      const m = document.getElementById('m');
      if (st.target) {
        const { x, y, size: sz } = st.target;
        m.style.display = 'block';
        m.style.width = m.style.height = sz + 'px';
        m.style.left = x - sz / 2 + 'px';
        m.style.top = y - sz / 2 + 'px';
        log('ev=TARGET&x=' + x + '&y=' + y + '&size=' + sz);
      } else {
        m.style.display = 'none';
      }
      log('ev=STEP&name=' + encodeURIComponent(st.step || ''));
    }
  } catch (e) {}
}
setInterval(poll, 250);
poll();
</script>
</body>
</html>
