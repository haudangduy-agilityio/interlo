[workspace]
members = [
    "crates/meeting-core",
    "crates/audio-io",
    "crates/engine-host",
    "crates/playback",
    "crates/store",
    "crates/summary-jobs",
    "crates/model-store",
    "crates/settings",
    "crates/diagnostics",
    "crates/workspace-notes",
    "crates/quick-actions",
    "crates/integration-tests",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
meeting-core = { path = "crates/meeting-core" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
