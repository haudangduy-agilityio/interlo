[workspace]
members = [
    "crates/meeting-core",
    "crates/audio-io",
    "crates/engine-host",
    "crates/playback",
    "crates/store",
    "crates/summary-jobs",
    "crates/model-store",
    "crates/settings",
    "crates/diagnostics",
    "crates/workspace-notes",
    "crates/quick-actions",
    "crates/integration-tests",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
meeting-core = { path = "crates/meeting-core" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# The hash of the model files is far too slow without optimisation: a developer
# build would hash gigabytes at about 30 MB/s.
[profile.dev.package."sha2@0.11"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
