name: Supply

# The dependency audit also runs inside the `check` job of ci.yml on every pull
# request. This workflow runs it weekly, so a new advisory shows up without a change,
# and on demand (scripts/check.sh supply).
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply:
    name: supply (dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep in step with CARGO_DENY_VERSION in ci.yml.
      CARGO_DENY_VERSION: 0.22.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup show

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix apps/ui ci --ignore-scripts

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"

      # Shipped dependencies, dev tooling and cargo-deny all block.
      - name: Run the dependency audit
        run: scripts/check.sh supply
