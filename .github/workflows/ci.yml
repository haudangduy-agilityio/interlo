name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every commit in the pull request needs a Signed-off-by trailer (D-57).
      # Merge commits are skipped. The base branch name comes in through env,
      # never inline in the script.
      - name: Check Signed-off-by on every commit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "origin/${BASE_REF}..HEAD"); do
            if [ "$(git show -s --format=%B "$sha" | grep -c '^Signed-off-by: .\+ <.\+>$')" -eq 0 ]; then
              echo "Missing Signed-off-by: $(git show -s --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Fix with: git rebase --signoff origin/${BASE_REF}"
            exit 1
          fi
          echo "All commits are signed off."

  check:
    name: check (macos-15)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # One place for the cargo-deny version; the weekly workflow file pins the same one.
      CARGO_DENY_VERSION: 0.22.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the version and the clippy and rustfmt
      # components. `rustup toolchain install` with no argument installs what
      # that file names (rustup 1.28 and later); `rustup show` no longer does.
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup show
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix apps/ui ci --ignore-scripts

      # cargo-deny is installed at a pinned version and the binary is cached, so a run
      # does not compile it. The cache is saved right after the install, before any
      # project code (build scripts, tests) runs, so that code cannot change what a later
      # run restores. Same action and SHA as the build cache; restore and save are its
      # two halves.
      - name: Restore cargo-deny
        id: cache-cargo-deny
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"

      - name: Save cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_DENY_VERSION }}

      # Runs on every pull request and every push to main (what it runs: scripts/check.sh,
      # mode supply). The weekly workflow file repeats it, so a new advisory shows up
      # without a change.
      # The gate is `scripts/check.sh full`. End-to-end tests are out of the
      # gate for now; `scripts/check.sh e2e` runs them separately.
      - name: Run the gate
        run: scripts/check.sh full

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/ui/playwright-report
            apps/ui/test-results
          if-no-files-found: ignore
          retention-days: 7
