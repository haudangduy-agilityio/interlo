[package]
name = "interlo-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "interlo_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = "2"

[features]
# Sample data for tests, screenshots and demos. Off by default: a default build
# answers NOT_IMPLEMENTED where a sample would stand in for real data.
demo-data = []
# The developer build: it reads a model folder from the environment. Off by default.
dev-models = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
audio-io = { path = "../../../crates/audio-io" }
engine-host = { path = "../../../crates/engine-host" }
meeting-core = { path = "../../../crates/meeting-core" }
model-store = { path = "../../../crates/model-store" }
playback = { path = "../../../crates/playback" }
workspace-notes = { path = "../../../crates/workspace-notes" }
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
engine-host = { path = "../../../crates/engine-host", features = ["mock"] }
meeting-core = { path = "../../../crates/meeting-core", features = ["test-support"] }

[lints]
workspace = true
